<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura da Barraquinha Digital</title><desc id="desc">Cliente e operação usam HTTPS para uma aplicação Next.js no App Service F1; a API acessa o Cosmos com identidade gerenciada. Pedidos e Discoveries são separados por tipo no mesmo contêiner.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#265b60"/></marker></defs>
<rect width="1200" height="730" rx="24" fill="#faf6eb"/>
<g font-family="Arial,sans-serif" fill="#153f43"><text x="55" y="60" font-size="29" font-weight="700">Barraquinha Digital · arquitetura implementada</text><text x="55" y="90" font-size="15">Uma aplicação, duas experiências e persistência compartilhada no Azure Cosmos DB</text>
<rect x="45" y="140" width="250" height="125" rx="15" fill="#fff" stroke="#9fb5ad"/><text x="68" y="175" font-size="21" font-weight="700">Cliente no celular</text><text x="68" y="204" font-size="16">Cardápio · pedido · consulta</text><text x="68" y="232" font-size="14">Sem cadastro · chave privada</text>
<rect x="45" y="305" width="250" height="125" rx="15" fill="#fff" stroke="#9fb5ad"/><text x="68" y="340" font-size="21" font-weight="700">Operação / totem</text><text x="68" y="369" font-size="16">Fila · filtros · transições</text><text x="68" y="397" font-size="14">Cookie administrativo HttpOnly</text>
<rect x="45" y="470" width="250" height="125" rx="15" fill="#fff" stroke="#9fb5ad"/><text x="68" y="505" font-size="21" font-weight="700">Professor / estúdio</text><text x="68" y="534" font-size="16">Discovery e documentos</text><text x="68" y="562" font-size="14">Modelo fictício · acesso restrito</text>
<rect x="385" y="130" width="370" height="475" rx="20" fill="#e6eee5" stroke="#8eaaa0"/><text x="412" y="168" font-size="22" font-weight="700">Azure App Service F1</text><text x="412" y="197" font-size="15">Linux / Node.js 22 · plano existente</text>
<rect x="410" y="225" width="320" height="100" rx="12" fill="#fff"/><text x="433" y="261" font-size="19" font-weight="700">Next.js + React</text><text x="433" y="291" font-size="15">Páginas responsivas e estado de UI</text>
<rect x="410" y="363" width="320" height="190" rx="12" fill="#153f43"/><g fill="#fff"><text x="433" y="399" font-size="19" font-weight="700">API / regras no servidor</text><text x="433" y="433" font-size="15">Preço e validação · autorização</text><text x="433" y="462" font-size="15">Idempotência · transições / ETag</text><text x="433" y="491" font-size="15">Consulta privada · documentos</text><text x="433" y="523" font-size="13">Sem serviço de inferência de IA ativo</text></g>
<rect x="865" y="210" width="290" height="330" rx="20" fill="#fff" stroke="#8eaaa0"/><text x="888" y="252" font-size="22" font-weight="700">Cosmos DB for NoSQL</text><text x="888" y="283" font-size="15">Free Tier · 400 RU/s manuais</text><text x="888" y="312" font-size="14">discovery / interviews · partição /id</text><line x1="887" y1="334" x2="1130" y2="334" stroke="#d0d8cc"/><text x="888" y="368" font-size="17" font-weight="700">Pedidos · TTL 7 dias</text><text x="888" y="395" font-size="14">kind = beach_order</text><text x="888" y="431" font-size="17" font-weight="700">Discovery · TTL 90 dias</text><text x="888" y="458" font-size="14">Registros sem campo kind</text><text x="888" y="501" font-size="13">Separação lógica, não multitenancy física</text>
<g fill="none" stroke="#265b60" stroke-width="2.5" marker-end="url(#arrow)"><path d="M295,202 L380,202"/><path d="M295,367 L380,367"/><path d="M295,532 L380,532"/><path d="M570,325 L570,358"/><path d="M755,440 L860,440"/></g>
<text x="309" y="187" font-size="13">HTTPS</text><text x="773" y="393" font-size="13">Identidade</text><text x="773" y="414" font-size="13">gerenciada</text><text x="55" y="660" font-size="15">API do cliente: GET /api/pedido/:numero + x-order-key · operação: /api/discovery/beach/orders</text><text x="55" y="693" font-size="13">Demonstração acadêmica sem pagamentos reais. Custos e disponibilidade dependem dos limites da conta e do plano gratuito.</text></g></svg>
